spring.application.name=BackendPart

# CORS — set ALLOWED_ORIGIN env variable to your Netlify URL in production
# e.g. https://your-site.netlify.app
allowed.origin=${ALLOWED_ORIGIN:*}

spring.datasource.username = root
spring.datasource.url=jdbc:mysql://localhost:3306/hire_details
spring.datasource.password= ${MYSQL_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql= true

spring.mail.host= smtp.gmail.com
spring.mail.port= 587
spring.mail.username= ${EMAIL}
spring.mail.password =${EMAIL_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true